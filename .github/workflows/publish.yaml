name: Publish
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # Required for npm trusted publishing (OIDC)

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      # Avoid `npm install -g npm` — bundled npm on some Node toolcache builds can be
      # incomplete (e.g. MODULE_NOT_FOUND for promise-retry). Corepack installs npm 11
      # without using the broken global npm CLI. Required for OIDC trusted publishing.
      - name: Enable npm 11 via Corepack (trusted publishing)
        run: |
          corepack enable
          corepack prepare npm@11 --activate
          npm --version

      - name: Install Dependencies
        run: npm ci

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
